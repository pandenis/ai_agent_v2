# AI Agent System — Log Rotation
# Install (production): sudo cp scripts/logrotate.conf /etc/logrotate.d/ai-agent
# Dry-run test:         logrotate -d scripts/logrotate.conf

# ── PRODUCTION (/srv/ai_agent) ────────────────────────────────────────────────
/srv/ai_agent/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 agent agent
    sharedscripts
    postrotate
        # Signal uvicorn to reopen log files if running
        [ -f /srv/ai_agent/uvicorn.pid ] && kill -USR1 $(cat /srv/ai_agent/uvicorn.pid) 2>/dev/null || true
    endscript
}

